# The Gateway API CRDs (standard channel): the portable routing API that
# Traefik, Istio and most other gateways implement. Pinned to a release tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"   # before Traefik and Istio read them
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false                   # deleting a CRD deletes every route
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
