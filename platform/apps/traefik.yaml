# Platform add-on from a public Helm chart: the ingress controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.2.0
    helm:
      valuesObject:
        service:
          spec:
            type: NodePort     # no cloud load balancer on kind
        ports:
          web:
            nodePort: 30080      # kind maps it to localhost:8088
          websecure:
            nodePort: 30443      # kind maps it to localhost:8443
        ingressClass:
          enabled: true
          isDefaultClass: true
        # Module 07: Traefik also implements the Gateway API. The chart creates
        # the GatewayClass "traefik" and a Gateway "traefik-gateway" on the
        # web entrypoint; checkout's namespaces may attach routes to it.
        providers:
          kubernetesGateway:
            enabled: true
        gateway:
          listeners:
            web:
              namespacePolicy:
                from: Selector
                selector:
                  matchLabels:
                    team: checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
