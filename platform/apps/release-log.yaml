# The release log: where Argo Rollouts sends a line for every finished or
# aborted release (module 08). In a real company: a chat channel or an
# incident tool. Here: a pod that prints what it receives.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-log
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/argocd-platform.git
    targetRevision: main
    path: release-log
  destination:
    server: https://kubernetes.default.svc
    namespace: release-log
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
