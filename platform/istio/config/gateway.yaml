# The platform's public entry into the mesh. Product teams attach their
# VirtualServices to it by name: istio-ingress/public.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public
  namespace: istio-ingress
spec:
  selector:
    istio: ingress                   # the pods of the istio-ingress release
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts:
        - "*/*.localtest.me"         # any namespace may bind a *.localtest.me host
