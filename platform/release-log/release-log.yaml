# Prints every notification it receives: kubectl -n release-log logs deploy/release-log
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-log
  labels:
    app.kubernetes.io/name: release-log
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: release-log
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-log
    spec:
      containers:
        - name: release-log
          image: python:3.13-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import datetime, http.server
              class H(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = self.rfile.read(int(self.headers.get("Content-Length", 0))).decode()
                      print(datetime.datetime.now().strftime("%H:%M:%S"), body, flush=True)
                      self.send_response(204); self.end_headers()
                  def log_message(self, *args):
                      pass
              http.server.HTTPServer(("", 8080), H).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: release-log
spec:
  selector:
    app.kubernetes.io/name: release-log
  ports:
    - name: http
      port: 80
      targetPort: http
